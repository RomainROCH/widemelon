name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.architecture.name }} (Qt ${{ matrix.qt }})
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
        architecture:
          - name: x86_64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build git pkg-config nodejs \
            extra-cmake-modules libcurl4-gnutls-dev libpcap0.8-dev \
            libsdl2-dev libarchive-dev libzstd-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev
          if [[ "${{ matrix.qt }}" == "6" ]]; then
            sudo apt-get install --no-install-recommends \
              qt6-base-dev qt6-base-private-dev qt6-multimedia-dev libqt6svg6-dev qt6-websockets-dev
          else
            sudo apt-get install --no-install-recommends \
              qtbase5-dev qtbase5-private-dev qtmultimedia5-dev libqt5svg5-dev libqt5websockets5-dev
          fi

      - name: Build and test
        env:
          WIDEMELON_USE_QT6: ${{ matrix.qt == 6 && '1' || '0' }}
        run: ./scripts/build.sh

      - name: Set up Node.js for real-browser tests
        if: matrix.qt == 6 && matrix.architecture.name == 'x86_64'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test phone layouts in real Chromium
        if: matrix.qt == 6 && matrix.architecture.name == 'x86_64'
        run: |
          cmake -S tests -B build/tests -DUSE_QT6=ON \
            -DWIDEMELON_ENABLE_BROWSER_SMOKE=ON \
            -DNODE_EXECUTABLE="$(command -v node)" \
            -DCHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          ctest --test-dir build/tests --output-on-failure -R '^phone_browser_(default|touchscreen_only)$'
